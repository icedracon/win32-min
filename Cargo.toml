[package]
name = "win32-min"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
authors = ["zevs"]
description = "Minimal hand-rolled Win32 FFI for Windows security and administration tooling. Feature-gated, no_std, and dependency-free."
license = "MIT"
homepage = "https://github.com/icedracon/win32-min"
repository = "https://github.com/icedracon/win32-min"
documentation = "https://docs.rs/win32-min"
readme = "README.md"
exclude = ["/.github", "/benchmarks"]
keywords = ["windows", "win32", "ffi", "no-std", "minimal"]
categories = ["os::windows-apis", "external-ffi-bindings", "no-std"]

[features]
default = []
security-token = []
services = []
lsa-auth = []
eventlog = []
process-thread = []
registry = []
security-descriptor = []
# Convenience alias — pull everything.
full = [
    "security-token",
    "services",
    "lsa-auth",
    "eventlog",
    "process-thread",
    "registry",
    "security-descriptor",
]

[dependencies]
# Zero. Everything is extern "system" declarations + repr(C) structs.
