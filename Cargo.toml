[package]
name = "win32-min"
version = "0.1.3"
edition = "2021"
rust-version = "1.74"
authors = ["zevs"]
description = "Minimal dependency-free Win32 FFI for Windows security research, DFIR, EDR, and administration tooling."
license = "MIT"
homepage = "https://github.com/icedracon/win32-min"
repository = "https://github.com/icedracon/win32-min"
documentation = "https://docs.rs/win32-min"
readme = "README.md"
exclude = ["/.github", "/benchmarks"]
keywords = ["windows", "win32", "ffi", "security", "dfir"]
categories = ["os::windows-apis", "external-ffi-bindings", "no-std"]

[features]
default = []
process = []
thread = []
module = []
file = []
security-token = []
services = []
lsa-auth = []
eventlog = []
registry = []
security = []
# Compatibility feature names retained from 0.1.1.
process-thread = ["process", "thread"]
security-descriptor = ["security"]
# Convenience alias — pull everything.
full = [
    "process",
    "thread",
    "module",
    "file",
    "security-token",
    "services",
    "lsa-auth",
    "eventlog",
    "registry",
    "security",
]

[[example]]
name = "process"
required-features = ["process"]

[[example]]
name = "token"
required-features = ["security-token"]

[[example]]
name = "registry"
required-features = ["registry"]

[[example]]
name = "service"
required-features = ["services"]

[[example]]
name = "eventlog"
required-features = ["eventlog"]

[[example]]
name = "security"
required-features = ["security"]

[dependencies]
# Zero. Everything is extern "system" declarations + repr(C) structs.
